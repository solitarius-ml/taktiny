[project]
name = "taktiny"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aqtp>=0.9.0",
    "huggingface-hub>=1.22.0",
    "jax>=0.10.2",
    "qwix>=0.1.8",
    "safetensors>=0.8.0",
    "transformers>=5.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "diffusers>=0.39.0",
    "equinox>=0.13.8",
    "flax>=0.12.7",
    "optax>=0.2.8",
    "pytest>=9.1.1",
    "tiktoken>=0.13.0",
    "torchvision>=0.27.1",
]
